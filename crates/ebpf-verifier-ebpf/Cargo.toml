[package]
name = "ebpf-verifier-ebpf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Kernel-space eBPF program: kprobes on __x64_sys_connect (telemetry) and __x64_sys_openat/__x64_sys_open/__x64_sys_openat2 (canary-path interceptor firing bpf_send_signal), with BPF_MAP_TYPE_RINGBUF telemetry."

# The eBPF program is compiled for the BPF target (bpfel-unknown-none) with a
# nightly toolchain.  It is intentionally a no_std crate.
[dependencies]
aya-ebpf = "0.1"
aya-log-ebpf = "0.1"

[features]
default = []