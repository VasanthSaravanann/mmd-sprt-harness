[package]
name = "harness-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "End-to-end pipeline wiring Gate 0, the parallel SPRT loop, and the Phase 4 IPW gate into a single deployment verdict, plus criterion benchmarks."

[dependencies]
harness-core = { path = "../harness-core" }
rayon.workspace = true
tokio.workspace = true
rand.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "pipeline_bench"
harness = false